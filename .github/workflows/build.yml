name: Build & Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Bundle HTML (PNGs als Base64 einbetten)
        run: |
          python3 - <<'EOF'
          import base64, re, os

          with open('index.html', 'r', encoding='utf-8') as f:
              html = f.read()

          # Alle referenzierten Asset-Pfade finden und ersetzen —
          # sowohl in HTML-Attributen als auch in JS-Strings (STICKS-Objekt)
          for path in set(re.findall(r'assets/[^\s"\']+\.png', html)):
              if os.path.exists(path):
                  with open(path, 'rb') as img:
                      b64 = base64.b64encode(img.read()).decode('ascii')
                  html = html.replace(path, f'data:image/png;base64,{b64}')
                  print(f'Eingebettet: {path}')
              else:
                  print(f'WARNUNG: {path} nicht gefunden')

          tag = os.environ['TAG']
          out = f'joystick-map-{tag}.html'
          with open(out, 'w', encoding='utf-8') as f:
              f.write(html)
          print(f'Erstellt: {out}')
          EOF
        env:
          TAG: ${{ github.ref_name }}

      - name: Release Notes aus CHANGELOG extrahieren
        run: |
          python3 - <<'EOF'
          import re, os

          tag = os.environ['TAG']
          with open('CHANGELOG.md', 'r', encoding='utf-8') as f:
              content = f.read()

          # Abschnitt fuer diese Version herausschneiden
          pattern = rf'(## {re.escape(tag)}.*?)(?=\n## v|\Z)'
          match = re.search(pattern, content, re.DOTALL)
          changelog_section = match.group(1).strip() if match else '_Keine Details im CHANGELOG gefunden._'

          notes = f"""## Joystick-Map {tag}

**Download:** `joystick-map-{tag}.html` — Einzeldatei, direkt im Browser öffnen.
Kein Server, keine Installation, keine weiteren Dateien nötig.

---

{changelog_section}

---

Alle Änderungen: [CHANGELOG.md](https://github.com/{os.environ['REPO']}/blob/main/CHANGELOG.md)"""

          with open('release_notes.md', 'w', encoding='utf-8') as f:
              f.write(notes)
          print('Release Notes erstellt.')
          EOF
        env:
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}

      - name: GitHub Release erstellen
        run: |
          gh release create "$TAG" \
            "joystick-map-${TAG}.html" \
            --title "Joystick-Map ${TAG}" \
            --notes-file release_notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
