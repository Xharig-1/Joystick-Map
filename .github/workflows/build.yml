name: Build & Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Bundle HTML (PNGs als Base64 einbetten)
        run: |
          python3 - <<'EOF'
          import base64, re, os

          with open('index.html', 'r', encoding='utf-8') as f:
              html = f.read()

          def embed_image(match):
              src = match.group(1)
              if os.path.exists(src):
                  with open(src, 'rb') as img:
                      b64 = base64.b64encode(img.read()).decode('ascii')
                  return f'src="data:image/png;base64,{b64}"'
              return match.group(0)

          html = re.sub(r'src="(assets/[^"]+\.png)"', embed_image, html)

          tag = os.environ['TAG']
          out = f'joystick-map-{tag}.html'
          with open(out, 'w', encoding='utf-8') as f:
              f.write(html)
          print(f'Erstellt: {out}')
          EOF
        env:
          TAG: ${{ github.ref_name }}

      - name: GitHub Release erstellen
        run: |
          gh release create "$TAG" \
            "joystick-map-${TAG}.html" \
            --title "Joystick-Map ${TAG}" \
            --notes "## Joystick-Map ${TAG}

          **Download:** \`joystick-map-${TAG}.html\` — Einzeldatei, direkt im Browser öffnen.

          Kein Server, keine Installation, keine weiteren Dateien nötig.

          Details: siehe [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md)"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
