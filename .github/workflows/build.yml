name: Build & Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Bundle HTML (PNGs als Base64 einbetten)
        run: python3 .github/scripts/bundle.py
        env:
          TAG: ${{ github.ref_name }}

      - name: Release Notes aus CHANGELOG extrahieren
        run: python3 .github/scripts/extract_notes.py
        env:
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}

      - name: GitHub Release erstellen
        run: |
          gh release create "$TAG" \
            "joystick-map-${TAG}.html" \
            --title "Joystick-Map ${TAG}" \
            --notes-file release_notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
